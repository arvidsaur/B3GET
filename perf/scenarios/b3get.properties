# B3GET with the model's defaults: data/population.csv and data/genotype.txt.
# Paths are from the repo root. Values are NetLogo code (Java properties syntax:
# write a backslash as \\).

model = code/B3GET.nlogox

# The model appends a row to ../results/metafile.csv on every run and loads that
# file into its output-area log at setup, so start each run without it.
# (perf/nlperf creates results/. NetLogo file paths are relative to code/.)
pre-setup = if file-exists? "../results/metafile.csv" [ file-delete "../results/metafile.csv" ]
setup = setup
go = go

# About 133 ms per step on the first few hundred steps, so a run takes ~40 s.
steps = 300
seeds = 1 2 3
checkpoint-every = 50

# Wall-clock values, left out of the fingerprint: simulation-id comes from
# time:create "" and start-date-and-time from date-and-time; output-body and the
# OUTPUT section hold the simulation log, whose rows carry clock times. They only
# label files and the on-screen log (interface.nls). Anything else that varied
# would fail record's fresh-JVM recheck.
ignore-globals = simulation-id start-date-and-time output-body
ignore-sections = OUTPUT

# The table extension exports its live tables in WeakHashMap order, which varies
# between runs; sort them so only their contents are compared.
unordered-extensions = table

reporter.1 = count anima1s with [ is.alive ]
reporter.2 = count anima1s
reporter.3 = sum [ penergy.supply ] of patches

bench.warmup = 1
bench.runs = 5
profile.runs = 1
jvm = -Xms4g -Xmx4g
